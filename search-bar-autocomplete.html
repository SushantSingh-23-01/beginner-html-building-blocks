<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Bar component</title>
    <style>
        /* 1. CSS Variables for standard colors */
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --text-color: #1f2937;
            --placeholder-color: #9ca3af;
            --border-color: #e5e7eb;    
        }
        /* 2. Page Reset & Centering */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
        }

        /* 3. Search Bar Container */
        .search-box {
            display: flex;
            align-items: center;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 50px;
            padding: 6px 6px 6px 16px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 6px -1px rgba(0, 0 , 0, 0.05);
            transition: all 0.2s ease-in-out;
        }

        .search-box:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        /* 4. Search Icon */
        .search-icon {
            width: 20px;
            height: 20px;
            color: var(--placeholder-color);
            margin-right: 12px;
            flex-shrink: 0;
        }

        /* 5. Text Input */
        .search-input {
            outline: none;
            border: none;
            border-radius: 5px;
            background: transparent;
            width: 100%;
            font-size: 1rem;
            color: var(--text-color);
            padding: 0;
        }

        .search-input::placeholder {
            color: var(--placeholder-color);
        }

        .search-btn {
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .search-btn:hover {
            background-color: var(--primary-hover);
        }

        /* Floating dropdown menu */
        .suggestions-box {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            list-style: none;
            overflow: hidden;
            z-index: 100;
            max-height: 250px;
            overflow-y: auto;
        }

        .suggestion-item {
            padding: 12px 20px;
            cursor: pointer;
            color: var(--text-color);
            font-size: 0.95rem;
            transition: background-color 0.15s ease;
        }  

        .suggestion-item:hover {
            background-color: #f3f4f6;
            color: var(--primary-color);
        }
        
        /* Helper utility class to hide elements */
        .hidden {
            display: none !important;
        }

        /* No results Message */
        .no-results {
            text-align: center;
            margin-top: 25px;
            color: var(--placeholder-color);
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <main class="container">
        <!-- Search Component Wrapper -->
        <div class="search-wrapper">
            <form class="search-box" onsubmit="event.preventDefault();">
                <!-- Search Icon (Inline SVG) -->
                <svg class="search-icon" 
                    xmlns="http://www.w3.org/2000/svg" 
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                
                <!-- Input Field-->
                <input 
                    type="text"
                    id="searchInput" 
                    class="search-input"
                    placeholder="search for topics, articles..."
                    aria-label="search"
                />

                <!-- Action Button -->
                <button type="submit" class="search-btn">Search</button>
            </form>

            <!-- Dynamic Suggestions Dropdown -->
            <ul id="suggestionsBox" class="suggestions-box hidden"></ul>

            <!-- Message when no items match -->
            <p id="noResults" class="no-results hidden">No matching languages found.</p>
        </div>
    </main>

    <script>
        // 1. Data Source
        const programmingLanguages = [
            "JavaScript",
            "Java",
            "Python",
            "PHP",
            "HTML & CSS",
            "React.js",
            "Ruby",
            "Rust",
            "TypeScript",
            "Node.js",
            "Swift",
            "C++",
            "C#"
        ];

        // 2. Select DOM elements
        const searchInput = document.getElementById('searchInput');
        const suggestionsBox = document.getElementById('suggestionsBox');
        const noResults = document.getElementById('noResults');

        // 3. Add event listener to the input field
        searchInput.addEventListener('input', function (event) {
            const query = event.target.value.toLowerCase().trim();

            // Clear existing items in dropdown
            suggestionsBox.innerHTML = '';

            // If input is empty, hide dropdown & "no results" message, then exit
            if (query === '') {
                suggestionsBox.classList.add('hidden');
                noResults.classList.add('hidden');
                return;
            }
            
            // Filter array for matching results
            const matches = programmingLanguages.filter(item =>
                item.toLowerCase().includes(query)
            );

            // Render matching items or toggle "no results" state
            if (matches.length > 0) {
                matches.forEach(matchText => {
                    const li = document.createElement('li');
                    li.classList.add('suggestion-item');
                    li.textContent = matchText;

                    // Click event: fill input and hide menu
                    li.addEventListener('click', function() {
                        searchInput.value = matchText;
                        suggestionsBox.classList.add('hidden');
                    });

                    suggestionsBox.appendChild(li);
                });

                suggestionsBox.classList.remove('hidden');
                noResults.classList.add('hidden');
            } else {
                suggestionsBox.classList.add('hidden');
                noResults.classList.remove('hidden');
            }
        });

        // 4. Hide dropdown when clicking outside of the search wrapper
        document.addEventListener('click', function (e) {
            if (!e.target.closest('.search-wrapper')) {
                suggestionsBox.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
